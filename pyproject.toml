[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mkravet-trainplat_jd449"
version = "0.1.0"
description = "统计各来源片段的贡献量与占比，标出大模型训练平台工程师·标注一致性与标注者偏差上最主要的来源"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "mkravet" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://mkravet.github.io"
Repository = "https://github.com/mkravet/trainplat_jd449"
Issues = "https://github.com/mkravet/trainplat_jd449/issues"

[project.scripts]
trainplat_jd449 = "trainplat_jd449:main"

[tool.setuptools]
py-modules = ["trainplat_jd449"]
